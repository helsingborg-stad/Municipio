name: Test:PHP

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read

    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3']

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup PHP with composer v2
        uses: shivammathur/setup-php@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2

      - name: Install dependencies
        run: composer i

      - name: Run tests
        id: phpunit
        continue-on-error: true
        run: |
          mkdir -p test-results
          set -o pipefail
          composer run test -- --log-junit test-results/phpunit.xml 2>&1 | tee test-results/phpunit.log

      - name: Publish PHPUnit test report
        if: ${{ !cancelled() && always() }}
        continue-on-error: true
        uses: dorny/test-reporter@v3
        with:
          name: PHPUnit (${{ matrix.php-version }})
          path: test-results/phpunit.xml
          reporter: phpunit-junit
          report-title: PHPUnit test results
          list-suites: failed
          list-tests: failed
          max-annotations: 50
          fail-on-error: false

      - name: Upload PHPUnit test artifacts
        if: ${{ !cancelled() && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: phpunit-results-${{ matrix.php-version }}
          path: test-results/
          if-no-files-found: warn

      - name: Fail when PHPUnit tests fail
        if: ${{ !cancelled() && steps.phpunit.outcome != 'success' }}
        run: |
          echo '::error title=PHPUnit tests failed::See the PHPUnit check report, job summary, or uploaded test artifacts for failure details.'
          exit 1
